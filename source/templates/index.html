<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Horizonte Inventory</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="hero">
    <div>
      <p class="eyebrow">Librería Horizonte</p>
      <h1>Horizonte Inventory</h1>
      <p>Control local de libros, útiles y existencias</p>
    </div>
    <div class="health" id="healthBadge">Comprobando servicio…</div>
  </header>

  <main>
    <section class="summary" aria-label="Resumen del inventario">
      <article><span>Total visible</span><strong id="totalProducts">0</strong></article>
      <article><span>Disponibles</span><strong id="availableProducts">0</strong></article>
      <article><span>Agotados</span><strong id="outProducts">0</strong></article>
    </section>

    <section class="panel toolbar">
      <div>
        <label for="stockFilter">Disponibilidad</label>
        <select id="stockFilter">
          <option value="all">Todos</option>
          <option value="available">Disponibles</option>
          <option value="out-of-stock">Agotados</option>
        </select>
      </div>
      <div>
        <label for="categoryFilter">Categoría</label>
        <select id="categoryFilter"><option value="">Todas</option></select>
      </div>
      <button class="primary" id="newProduct">+ Nuevo producto</button>
    </section>

    <section class="panel table-panel">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Inventario</p>
          <h2>Productos registrados</h2>
        </div>
        <span id="resultMessage">Cargando…</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th><th>Código</th><th>Nombre</th><th>Categoría</th>
              <th>Precio</th><th>Cantidad</th><th>Registro</th><th>Acciones</th>
            </tr>
          </thead>
          <tbody id="productRows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <dialog id="productDialog">
    <form id="productForm">
      <div class="dialog-heading">
        <div><p class="eyebrow">Gestión de inventario</p><h2 id="dialogTitle">Nuevo producto</h2></div>
        <button type="button" class="icon-button" id="closeDialog" aria-label="Cerrar">×</button>
      </div>
      <input type="hidden" id="productId">
      <div class="form-grid">
        <label>Código<input id="code" maxlength="20" required placeholder="LIB-021"></label>
        <label>Categoría<input id="category" maxlength="80" required placeholder="Literatura"></label>
        <label class="wide">Nombre<input id="name" maxlength="150" required placeholder="Nombre del producto"></label>
        <label>Precio (₡)<input id="price" type="number" min="0" step="0.01" required></label>
        <label>Cantidad<input id="quantity" type="number" min="0" step="1" required></label>
      </div>
      <p class="form-message" id="formMessage" role="alert"></p>
      <div class="actions">
        <button type="button" class="secondary" id="cancelDialog">Cancelar</button>
        <button type="submit" class="primary">Guardar producto</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status"></div>
  <script src="/static/app.js"></script>
</body>
</html>
